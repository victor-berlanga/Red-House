[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "red-house-services"
version = "0.4.4"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["redhouse*", "ms_*", "servicio_monitoreo*"]

[tool.setuptools.package-data]
redhouse = ["*.xsd", "document_routes.json", "shared_migrations/*.sql", "reference_data/*.json", "reference_data/roads/*.json"]
"*" = ["outputs.json", "migrations/*.sql", "contracts/*.json", "contracts/*.xml", "contracts/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
