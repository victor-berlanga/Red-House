name: RedHouse
options:
  bundleIdPrefix: org.redhouse
  deploymentTarget:
    iOS: '15.0'
configs:
  Debug: debug
  DebugLab: debug
  Release: release
schemes:
  RedHouseLab:
    build:
      targets:
        RedHouse: all
    run:
      config: DebugLab
    test:
      config: DebugLab
    profile:
      config: DebugLab
    analyze:
      config: DebugLab
    archive:
      config: DebugLab
      # The build script rejects archive/install actions for the lab variant.
targets:
  RedHouse:
    type: application
    platform: iOS
    sources: [AppDelegate.swift, IOSDeviceAccess.swift, Icons]
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: '0.3.1'
        CFBundleVersion: '3'
        CFBundleDisplayName: '$(REDHOUSE_DISPLAY_NAME)'
        RedHouseVariant: '$(REDHOUSE_VARIANT)'
        RedHouseGateway: '$(REDHOUSE_GATEWAY)'
        RedHouseLabCASHA256: '$(REDHOUSE_LAB_CA_SHA256)'
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: 'Escanear la unidad y capturar evidencia del traslado autorizado.'
        NSLocationWhenInUseUsageDescription: 'Compartir la ubicación durante el traslado asignado y autorizado.'
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60, AppIcon76x76, AppIcon83.5x83.5]
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: ['$(PRODUCT_BUNDLE_IDENTIFIER).observations']
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.redhouse.mobile
        PRODUCT_MODULE_NAME: RedHouseHost
        SWIFT_VERSION: '5.0'
        FRAMEWORK_SEARCH_PATHS: '$(SRCROOT)/../composeApp/build/ios-$(REDHOUSE_VARIANT)/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS: '$(inherited) -framework RedHouse'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        REDHOUSE_VARIANT: normal
        REDHOUSE_GATEWAY: 'https://34.18.186.116'
        REDHOUSE_DISPLAY_NAME: 'Red House'
      configs:
        DebugLab:
          INFOPLIST_FILE: InfoLab.plist
          PRODUCT_BUNDLE_IDENTIFIER: org.redhouse.mobile.lab
          PRODUCT_NAME: RedHouseLab
          REDHOUSE_VARIANT: lab
          REDHOUSE_GATEWAY: ''
          REDHOUSE_DISPLAY_NAME: 'Red House Lab'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEBUG REDHOUSE_LAB'
          KOTLIN_FRAMEWORK_BUILD_TYPE: Debug
    preBuildScripts:
      - name: Build shared framework
        script: |
          /bin/bash "$SRCROOT/build_shared_framework.sh"
        basedOnDependencyAnalysis: false
