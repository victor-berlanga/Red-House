<svg aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 586 862" height="862" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="586" id="finalDiagram3"><style>#finalDiagram3{font-family:Arial;font-size:16px;fill:#0f172a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#finalDiagram3 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#finalDiagram3 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#finalDiagram3 .error-icon{fill:hsl(30, 40%, 100%);}#finalDiagram3 .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#finalDiagram3 .edge-thickness-normal{stroke-width:1px;}#finalDiagram3 .edge-thickness-thick{stroke-width:3.5px;}#finalDiagram3 .edge-pattern-solid{stroke-dasharray:0;}#finalDiagram3 .edge-thickness-invisible{stroke-width:0;fill:none;}#finalDiagram3 .edge-pattern-dashed{stroke-dasharray:3;}#finalDiagram3 .edge-pattern-dotted{stroke-dasharray:2;}#finalDiagram3 .marker{fill:#64748b;stroke:#64748b;}#finalDiagram3 .marker.cross{stroke:#64748b;}#finalDiagram3 svg{font-family:Arial;font-size:16px;}#finalDiagram3 p{margin:0;}#finalDiagram3 .label{font-family:Arial;color:#0f172a;}#finalDiagram3 .cluster-label text{fill:rgb(0, 0, 0);}#finalDiagram3 .cluster-label span{color:rgb(0, 0, 0);}#finalDiagram3 .cluster-label span p{background-color:transparent;}#finalDiagram3 .label text,#finalDiagram3 span{fill:#0f172a;color:#0f172a;}#finalDiagram3 .node rect,#finalDiagram3 .node circle,#finalDiagram3 .node ellipse,#finalDiagram3 .node polygon,#finalDiagram3 .node path{fill:#f1f5f9;stroke:#64748b;stroke-width:1px;}#finalDiagram3 .rough-node .label text,#finalDiagram3 .node .label text,#finalDiagram3 .image-shape .label,#finalDiagram3 .icon-shape .label{text-anchor:middle;}#finalDiagram3 .node .katex path{fill:#000;stroke:#0