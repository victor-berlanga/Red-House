name: Microservicios y portal
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDHOUSE_TEST_ROOT: /tmp
      REDHOUSE_TEST_MONGOD: /usr/bin/mongod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/services/requirements*.txt
            apps/web/requirements.txt
      # https://www.mongodb.com/docs/v8.0/tutorial/install-mongodb-on-ubuntu/
      - name: Dependencias locales, sin contenedores
        run: |
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          # El proyecto fija PostgreSQL 14 (scripts/dependencies.py); Ubuntu 24.04 trae 16.
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-14 redis-server mongodb-org-server
          echo /usr/lib/postgresql/14/bin >> "$GITHUB_PATH"
          python -m pip install -r apps/services/requirements-dev.txt
          # components.sh exige el intérprete que deja install.sh; en CI es el de setup-python.
          mkdir -p apps/services/.venv/bin
          ln -sf "$(command -v python)" apps/services/.venv/bin/python
      - name: Catálogo HLA público fijado por versión y SHA-256
        run: python apps/services/scripts/fetch_public_references.py hla --version 3.66.0 --directory .local/reference-data/hla
      - name: Análisis estático y formato
        run: |
          ruff check --select E9,F63,F7,F82 apps/services apps/web/src/integration
          ruff format --check apps/services apps/web/src/integration
      - name: OpenAPI versionado reproducible
        run: python apps/services/scripts/document.py --check-openapi
      - name: Contratos, seguridad, datos y portal HTTP
        run: >-
          python -m pytest apps/services/tests -q
          --junitxml=results/services.xml
          --log-file=results/services.log --log-file-level=INFO
          -o junit_logging=all -o junit_log_passing_tests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/services.*
