name: Escritorio multiplataforma

on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'apps/services/**/contracts/**'
      - 'apps/services/redhouse/response.xsd'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/services/**/contracts/**'
      - 'apps/services/redhouse/response.xsd'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    defaults:
      run:
        working-directory: apps/desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/requirements*.txt
      - name: Contratos empaquetados coinciden con sus propietarios
        run: python sync_contracts.py --check
      - name: Bibliotecas de Qt en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Entorno de construcción aislado
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          subprocess.run([sys.executable, '-m', 'venv', '.venv'], check=True)
          bindir = pathlib.Path('.venv', 'Scripts' if os.name == 'nt' else 'bin').resolve()
          executable = bindir / ('python.exe' if os.name == 'nt' else 'python')
          subprocess.run([str(executable), '-m', 'pip', 'install', '-r', 'requirements-build.txt', 'pytest==9.1.1'], check=True)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              stream.write(str(bindir) + '\n')
      - name: Contratos, seguridad local e interacción Qt
        run: python -m pytest tests --ignore-glob='*_lab.py' -q --junitxml=results/unit.xml
      - name: Empaquetar Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat
      - name: Empaquetar macOS o Linux
        if: runner.os != 'Windows'
        run: sh build.sh
      - name: Arranque del ejecutable y recursos incluidos
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          if sys.platform == 'darwin':
              executable = pathlib.Path('dist/RedHouse.app/Contents/MacOS/RedHouse')
          elif os.name == 'nt':
              executable = pathlib.Path('dist/RedHouse/RedHouse.exe')
          else:
              executable = pathlib.Path('dist/RedHouse/RedHouse')
          report = pathlib.Path('results/package-smoke.json').resolve()
          subprocess.run([str(executable.resolve()), '--smoke-report', str(report)], check=True, timeout=45)
          result = json.loads(report.read_text(encoding='utf-8'))
          assert result['ok'] is True, result
      - name: Archivar paquete y procedencia
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, shutil, subprocess, sys
          target = '${{ matrix.target }}'
          results = pathlib.Path('results')
          results.mkdir(exist_ok=True)
          metadata = {
              'commit': os.environ['GITHUB_SHA'], 'runner': '${{ matrix.runner }}',
              'platform': platform.platform(), 'machine': platform.machine(),
              'python': sys.version, 'validation': 'unit tests and offscreen package startup',
              'signed_distribution': False,
          }
          metadata['dependencies'] = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True).splitlines()
          archive = pathlib.Path(shutil.make_archive(str(results / ('RedHouse-' + target)), 'zip' if os.name == 'nt' else 'gztar', root_dir='dist', base_dir='RedHouse.app' if sys.platform == 'darwin' else 'RedHouse'))
          metadata['artifact'] = archive.name
          metadata['sha256'] = hashlib.sha256(archive.read_bytes()).hexdigest()
          (results / 'build.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/results/
          if-no-files-found: error
          retention-days: 14
