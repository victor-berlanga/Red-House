worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=2s ipv6=off;
  log_format safe '$request_method $uri $status $request_time';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 256k;
  server { listen 8080; location = /health/live { return 200 "up"; } }
  upstream identidad_acceso {
    zone identidad_acceso 64k;
    server identidad-acceso-a:8080 resolve max_fails=1 fail_timeout=2s;
    server identidad-acceso-b:8080 resolve max_fails=1 fail_timeout=2s;
    keepalive 8;
  }
  server { listen 5101; location / {
    proxy_pass http://identidad_acceso;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_connect_timeout 1s;
    proxy_read_timeout 8s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    add_header X-Backend $upstream_addr always;
  } }
  upstream donantes {
    zone donantes 64k;
    server donantes-a:8080 resolve max_fails=1 fail_timeout=2s;
