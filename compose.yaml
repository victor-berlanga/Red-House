{
  "name": "redhouse-parcial2",
  "services": {
    "postgres": {
      "image": "postgres:14-bookworm",
      "environment": {
        "POSTGRES_USER": "rh_bootstrap",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/postgres_password"
      },
      "secrets": [
        "postgres_password"
      ],
      "volumes": [
        "postgres:/var/lib/postgresql/data"
      ],
      "networks": [
        "data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U rh_bootstrap -d postgres"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      },
      "restart": "unless-stopped"
    },
    "mongodb": {
      "image": "redhouse/mongodb-health:8.0",
      "command": [
        "mongod",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "0.25"
      ],
      "environment": {
        "MONGO_INITDB_ROOT_USERNAME": "rh_bootstrap",
        "MONGO_INITDB_ROOT_PASSWORD_FILE": "/run/secrets/mongo_password"
      },
      "secrets": [
        "mongo_password"
      ],
      "volumes": [
        "mongodb:/data/db"
      ],
      "networks": [
        "data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "/usr/local/lib/redhouse/mongo_health.py"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 15
      },
      "restart": "unless-stopped",
      "build": {
        "context": ".",
        "dockerfile": "deployment/Dockerfile.mongodb"
      }
    },
    "redis": {
      "image": "redis:7.4-bookworm",
      "entrypoint": [
        "sh",
        "-c",
        "if [ ! -f /data/users.acl ]; then cp /run/secrets/redis_acl /data/users.acl; chown redis:redis /data/users.acl; fi; exec /usr/local/bin/docker-entrypoint.sh redis-server /run/secrets/redis_config"
      ],
      "secrets": [
        "redis_acl",
        "redis_config"
      ],
      "volumes": [
        "redis:/data"
      ],
      "networks": [
        "data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "redis-cli ping 2>&1 | grep -q NOAUTH"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      },
      "restart": "unless-stopped"
    },
    "bootstrap": {
      "profiles": [
        "install"
      ],
      "build": {
        "context": ".",
        "dockerfile": "deployment/Dockerfile.bootstrap"
      },
      "volumes": [
        "${REDHOUSE_COMPOSE_DIR:-./.local/compose}:/run/install"
      ],
      "networks": [
        "data"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        },
        "mongodb": {
          "condition": "service_healthy"
        }
      }
    },
    "identidad-acceso-a": {
      "image": "redhouse/identidad_acceso:${REDHOUSE_TAG:-0.3.0}",
      "secrets": [
        {
          "source": "identidad_acceso_config",
          "target": "config"
        }
      ],
      "networks": [
        "data"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "init": true,
      "restart": "unless-stopped",
      "stop_grace_period": "20s",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-S",
          "/app/deployment/healthcheck.py"
        ],
        "interval": "15s",
        "timeout": "8s",
        "start_period": "30s",
        "retries": 5
      },
      "build": {
        "context": ".",
        "dockerfile": "apps/services/ms_identidad_acceso/Dockerfile"
      }
    },
