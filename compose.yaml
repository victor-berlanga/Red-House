      ],
      "cap_drop": [
        "ALL"
      ],
      "init": true,
      "restart": "unless-stopped",
      "stop_grace_period": "20s",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-S",
          "/app/deployment/healthcheck.py"
        ],
        "interval": "15s",
        "timeout": "8s",
        "start_period": "30s",
        "retries": 5
      }
    },
    "web": {
      "build": {
        "context": ".",
        "dockerfile": "apps/web/Dockerfile"
      },
      "image": "redhouse/web:${REDHOUSE_TAG:-0.3.0}",
      "secrets": [
        {
          "source": "web_config",
          "target": "config"
        }
      ],
      "volumes": [
        "${REDHOUSE_COMPOSE_DIR:-./.local/compose}/apps:/run/redhouse:ro"
      ],
      "ports": [
        "127.0.0.1:${REDHOUSE_WEB_PORT:-6050}:8080"
      ],
      "networks": [
        "data",
        "edge"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "init": true,
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-S",
          "/app/deployment/healthcheck.py",
          "web"
        ],
        "interval": "15s",
        "timeout": "8s",
        "start_period": "40s",
        "retries": 5
      }
    },
    "gateway": {
      "image": "nginx:1.28-alpine",
      "user": "101:101",
      "entrypoint": [
        "nginx",
        "-g",
        "daemon off;"
      ],
      "volumes": [
        "./deployment/nginx.conf:/etc/nginx/nginx.conf:ro"
      ],
      "ports": [
        "127.0.0.1:6101:5101",
        "127.0.0.1:6102:5102",
        "127.0.0.1:6103:5103",
        "127.0.0.1:6104:5104",
        "127.0.0.1:6105:5105",
        "127.0.0.1:6106:5106",
        "127.0.0.1:6107:5107",
        "127.0.0.1:6108:5108",
        "127.0.0.1:6109:5109",
        "127.0.0.1:6110:5110",
        "127.0.0.1:6111:5111"
      ],
      "networks": [
        "data",
        "edge"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/health/live"
        ],
        "interval": "10s",
        "timeout": "3s",
        "retries": 5
      }
    }
  },
  "networks": {
    "data": {
      "internal": true
    },
    "edge": {}
  },
  "volumes": {
    "postgres": {},
    "mongodb": {},
    "redis": {}
